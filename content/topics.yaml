    lem:flow-triangle-path, lem:gomory-hu-invariant, thm:gomory-hu]
- slug: global-min-cut
  title: Global minimum cuts
  intro: The minimum cut of a whole network by n − 1 flows, by node identification (Stoer–Wagner) and by random contractions (Karger, Karger–Stein).
  ids: [def:global-min-cut, prop:global-cut-flows, cor:identification-mincut, alg:simple-min-cut, def:tightly-connected,
